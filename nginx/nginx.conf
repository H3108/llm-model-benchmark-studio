# Outer reverse proxy: terminates TLS, routes to frontend + backend containers.
# The DOMAIN placeholder must be replaced with the actual domain (see deploy
# instructions in README). HTTP always redirects to HTTPS except for the
# Let's Encrypt ACME challenge path.

# ── HTTP → HTTPS redirect (+ ACME challenge) ──
server {
    listen 80;
    server_name _;

    # Let's Encrypt webroot for certificate renewal.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Everything else → HTTPS.
    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS (main site) ──
server {
    listen 443 ssl http2;
    server_name benchmark.hush7.online;

    # SSL certificates (issued by certbot).
    ssl_certificate     /etc/letsencrypt/live/benchmark.hush7.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/benchmark.hush7.online/privkey.pem;

    # Modern TLS settings.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security headers.
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # API → backend container.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Everything else → frontend container (static SPA).
    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
