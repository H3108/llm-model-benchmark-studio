# LLM Model Benchmark Studio — system nginx vhost
# Routes benchmark.hush7.online to the Docker containers.
# Install:  cp deploy/benchmark.conf /etc/nginx/sites-enabled/benchmark.conf
#           nginx -t && systemctl reload nginx
# HTTPS is terminated by xray (SNI fallback benchmark.hush7.online → 127.0.0.1:80).

server {
    listen 80;
    server_name benchmark.hush7.online;

    # Frontend (static SPA) → frontend container.
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API → backend container.
    location /api/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Static assets cache.
    location /assets/ {
        proxy_pass http://127.0.0.1:8081;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    access_log /var/log/nginx/benchmark.access.log;
    error_log  /var/log/nginx/benchmark.error.log;
}
