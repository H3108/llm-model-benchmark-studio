# ── Production compose (VPS deployment behind system nginx) ──
# The VPS already runs a system nginx (:80) + xray (:443, TLS termination),
# so this compose only exposes loopback ports. The system nginx vhost
# (see deploy/benchmark.conf) routes:
#   /     → frontend container (:8081)
#   /api/ → backend container  (:8001)
#
# Usage:
#   1. cp backend/.env.example backend/.env && edit backend/.env
#   2. docker compose up -d --build
#   3. Create system nginx vhost (deploy/benchmark.conf) and reload nginx
#   4. HTTPS is terminated by xray (SNI fallback → 127.0.0.1:80)
#
# For local development, use docker-compose.dev.yml instead:
#   docker compose -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    environment:
      # Point SQLite into the persistent volume (config.py reads DATABASE_URL).
      - DATABASE_URL=sqlite:////app/data/benchmark.db
    ports:
      - "127.0.0.1:8001:8000"
    volumes:
      # SQLite DB persists across container recreation.
      - benchmark_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8081:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  benchmark_data:
