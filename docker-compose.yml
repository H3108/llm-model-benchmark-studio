# ── Production compose (VPS deployment with HTTPS) ──
# Usage:
#   1. cp backend/.env.example backend/.env && edit backend/.env
#   2. Edit nginx/nginx.conf — replace DOMAIN with your actual domain
#   3. docker compose up -d
#   4. First-time SSL: docker compose run --rm certbot certonly \
#        --webroot -w /var/www/certbot -d <DOMAIN> --email <EMAIL> \
#        --agree-tos --no-eff-email
#   5. Restart nginx: docker compose restart nginx
#
# For local development, use docker-compose.dev.yml instead:
#   docker compose -f docker-compose.dev.yml up

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: ./backend/.env
    expose:
      - "8000"
    volumes:
      - benchmark_data:/app/data
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot_conf:/etc/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  certbot:
    image: certbot/certbot
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Auto-renew: check every 12h, renew if within 30 days of expiry.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --quiet; sleep 12h & wait $${!}; done;'"
    restart: unless-stopped

volumes:
  benchmark_data:
  certbot_conf:
  certbot_www:
